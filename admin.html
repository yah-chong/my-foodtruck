<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餐車老闆管理後台</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; max-width: 500px; margin: 0 auto; }
    .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    button { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-open { background: #4CAF50; color: white; }
    .btn-prep { background: #FF9800; color: white; }
    .btn-close { background: #f44336; color: white; }
    .btn-gps { background: #2196F3; color: white; }
    .btn-speech { background: #9C27B0; color: white; }
    .btn-save-loc { background: #673AB7; color: white; }
    .btn-del { background: #e53935; color: white; width: auto; padding: 4px 8px; font-size: 12px; margin: 0; }
    input[type="text"] { width: 95%; padding: 10px; margin: 8px 0; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; }
    .status-text { font-weight: bold; color: #333; }
    .history-item { background: #f9f9f9; border-left: 4px solid #2196F3; padding: 8px 12px; margin: 6px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    .history-info { font-size: 14px; }
  </style>
  <!-- Firebase 8.x Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <h2>🚚 餐車即時管理控制台</h2>

  <!-- 1. 營業狀態設定 -->
  <div class="card">
    <h3>1. 切換營業狀態</h3>
    <button class="btn-open" onclick="setStatus('🟢 營業中')">🟢 設定為：營業中</button>
    <button class="btn-prep" onclick="setStatus('🟡 準備中')">🟡 設定為：準備中</button>
    <button class="btn-close" onclick="setStatus('🔴 休息中')">🔴 設定為：休息中</button>
    <p>目前狀態：<span id="currentStatus" class="status-text">未設定</span></p>
  </div>

  <!-- 2. 廣播訊息與語音輸入 -->
  <div class="card">
    <h3>2. 發布最新廣播</h3>
    <input type="text" id="broadcastMsg" placeholder="例如：今天在公園旁，招牌牛肉堡熱賣中！">
    <button class="btn-speech" onclick="startSpeech()">🎤 語音轉文字輸入</button>
    <button class="btn-gps" style="background:#009688" onclick="sendBroadcast()">📢 發布廣播</button>
  </div>

  <!-- 3. GPS 定位追蹤 -->
  <div class="card">
    <h3>3. GPS 即時定位追蹤</h3>
    <button class="btn-gps" id="gpsBtn" onclick="toggleGPS()">📡 開啟即時定位上傳</button>
    <p>目前即時座標：<span id="gpsCoords" class="status-text">未開啟</span></p>
  </div>

  <!-- 4. 駐點位置歷史紀錄（最多10筆） -->
  <div class="card">
    <h3>4. 📍 打卡/紀錄駐點位置 (保留最新10筆)</h3>
    <input type="text" id="locationNote" placeholder="例如：鳳山青年夜市 / 衛武營捷運站3號出口">
    <button class="btn-save-loc" onclick="saveCurrentLocation()">📌 儲存當前位置至歷史清單</button>
    
    <h4 style="margin-top: 15px; margin-bottom: 5px;">📜 最新 10 個駐點歷史：</h4>
    <div id="historyList">載入中...</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY", 
      authDomain: "food-truck-1f6aa.firebaseapp.com",
      databaseURL: "https://food-truck-1f6aa-default-rtdb.firebaseio.com",
      projectId: "food-truck-1f6aa",
      storageBucket: "food-truck-1f6aa.firebasestorage.app",
      messagingSenderId: "1061981192488",
      appId: "YOUR_APP_ID" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('foodtruck');

    let watchId = null;
    let currentLat = null;
    let currentLng = null;

    // 監聽即時營業狀態
    db.child('status').on('value', (snap) => {
      if(snap.exists()) document.getElementById('currentStatus').innerText = snap.val();
    });

    // 1. 更新營業狀態
    function setStatus(status) {
      db.update({ status: status });
    }

    // 2. 發布廣播訊息
    function sendBroadcast() {
      const msg = document.getElementById('broadcastMsg').value;
      if (msg) {
        db.update({ broadcast: msg, updatedAt: new Date().toLocaleTimeString() });
        alert('廣播已發布！');
      }
    }

    // 語音轉文字
    function startSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('您的瀏覽器不支援語音識別，請使用 Chrome 瀏覽器。');
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;
        document.getElementById('broadcastMsg').value = text;
      };
      recognition.start();
    }

    // 3. 切換 GPS 自動上傳
    function toggleGPS() {
      const btn = document.getElementById('gpsBtn');
      if (watchId === null) {
        if ("geolocation" in navigator) {
          watchId = navigator.geolocation.watchPosition(
            (pos) => {
              currentLat = pos.coords.latitude;
              currentLng = pos.coords.longitude;
              db.update({ lat: currentLat, lng: currentLng });
              document.getElementById('gpsCoords').innerText = `${currentLat.toFixed(5)}, ${currentLng.toFixed(5)}`;
            },
            (err) => alert('無法取得 GPS 定位：' + err.message),
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
          btn.innerText = "🛑 停止定位上傳";
          btn.style.background = "#f44336";
        } else {
          alert('您的裝置不支援 GPS 定位');
        }
      } else {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btn.innerText = "📡 開啟即時定位上傳";
        btn.style.background = "#2196F3";
        document.getElementById('gpsCoords').innerText = "已停止上傳";
      }
    }

    // 4. 儲存當前位置至歷史紀錄，並維護「最多 10 筆」
    function saveCurrentLocation() {
      if (!currentLat || !currentLng) {
        alert('請先開啟【GPS 即時定位上傳】以取得目前座標！');
        return;
      }

      const noteInput = document.getElementById('locationNote');
      const note = noteInput.value.trim() || '未命名營業地點';
      const historyRef = db.child('history');

      const now = new Date();
      const timeStr = `${now.getMonth() + 1}/${now.getDate()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

      // 新增一筆位置
      historyRef.push({
        lat: currentLat,
        lng: currentLng,
        note: note,
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        timeStr: timeStr
      }, (error) => {
        if (!error) {
          noteInput.value = '';
          alert('📌 已成功儲存位置！');
          trimHistory(); // 檢查並維持最多 10 筆
        } else {
          alert('儲存失敗：' + error.message);
        }
      });
    }

    // 限制歷史紀錄只保留最新的 10 筆
    function trimHistory() {
      const historyRef = db.child('history');
      historyRef.orderByChild('timestamp').once('value', (snapshot) => {
        const total = snapshot.numChildren();
        if (total > 10) {
          let deleteCount = total - 10;
          snapshot.forEach((child) => {
            if (deleteCount > 0) {
              child.ref.remove(); // 刪除最舊的資料
              deleteCount--;
            }
          });
        }
      });
    }

    // 手動刪除單筆紀錄
    function deleteHistoryItem(key) {
      if (confirm('確定要刪除這筆位置紀錄嗎？')) {
        db.child('history').child(key).remove();
      }
    }

    // 實時監聽並顯示最新 10 筆歷史紀錄
    db.child('history').orderByChild('timestamp').limitToLast(10).on('value', (snapshot) => {
      const historyContainer = document.getElementById('historyList');
      if (!snapshot.exists()) {
        historyContainer.innerHTML = '<p style="color:#888;">目前尚無歷史位置紀錄。</p>';
        return;
      }

      let items = [];
      snapshot.forEach((child) => {
        items.push({ key: child.key, ...child.val() });
      });

      // 讓最新新增的顯示在最上方
      items.reverse();

      let html = '';
      items.forEach((item) => {
        html += `
          <div class="history-item">
            <div class="history-info">
              <strong>${item.note}</strong> <small style="color:#666;">(${item.timeStr || ''})</small><br>
              <small style="color:#888;">座標：${item.lat.toFixed(4)}, ${item.lng.toFixed(4)}</small>
            </div>
            <button class="btn-del" onclick="deleteHistoryItem('${item.key}')">刪除</button>
          </div>
        `;
      });
      historyContainer.innerHTML = html;
    });
  </script>
</body>
</html>
